    <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f0e6;color:#24211d;font:18px/1.5 system-ui,sans-serif;text-align:center}main{max-width:34rem;padding:2rem}a{color:#0f625e}</style>

  <body>
    <main><p>5分間の英語初回レッスンを開いています…</p><p><a id="continue" href="../../../../../#/course-preview?target=en&unit=1">レッスンへ進む</a></p></main>
    <script>
      const incoming = new URLSearchParams(window.location.search);
      const ref = incoming.get("ref");
      const share = incoming.get("share");
      const destination = new URL("../../../../../", window.location.href);
      const route = new URLSearchParams({ target: "en", unit: "1" });
      route.set("sharedUnit", "6");
      if (ref && /^[a-zA-Z0-9-]{1,64}$/.test(ref)) {
        route.set("challenge", "1");
        route.set("ref", ref);
        if (share && /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(share)) route.set("share", share);
      }
      destination.search = "";
      destination.hash = "/course-preview?" + route.toString();
      document.getElementById("continue").href = destination.href;
      window.location.replace(destination.href);
    </script>
  </body>
